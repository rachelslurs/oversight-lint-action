name: Test

on:
  push:
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [oversight-lint-published]
  schedule:
    # Backup if a publish dispatch is missed; primary signal is repository_dispatch.
    - cron: '0 14 * * 1'

permissions:
  contents: read

env:
  # Publish events pin the exact release; push/PR/schedule exercise latest.
  OVERSIGHT_LINT_VERSION: ${{ github.event.client_payload.version || 'latest' }}

jobs:
  resolve-version:
    name: Wait for published package
    runs-on: ubuntu-latest
    steps:
      - name: Ensure oversight-lint@$OVERSIGHT_LINT_VERSION is on npm
        run: |
          set -euo pipefail
          version="$OVERSIGHT_LINT_VERSION"
          echo "Resolving oversight-lint@$version"
          for i in $(seq 1 30); do
            if npm view "oversight-lint@$version" version; then
              exit 0
            fi
            echo "Not visible yet (attempt $i/30); sleeping 10s"
            sleep 10
          done
          echo "Timed out waiting for oversight-lint@$version on npm"
          exit 1

  clean:
    name: Clean manifest passes
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          manifest: test/clean-manifest.json
          max-warnings: 0
          version: ${{ env.OVERSIGHT_LINT_VERSION }}

  findings:
    name: Error manifest fails
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: lint
        continue-on-error: true
        uses: ./
        with:
          manifest: test/error-manifest.json
          version: ${{ env.OVERSIGHT_LINT_VERSION }}
      - name: Assert the action failed on error findings
        run: |
          if [[ "${{ steps.lint.outcome }}" != "failure" ]]; then
            echo "Expected the action to fail on error findings, got '${{ steps.lint.outcome }}'."
            exit 1
          fi
          echo "OK: the action failed as expected on error findings."
      - name: Assert required-prop-undocumented annotation title
        env:
          VERSION: ${{ env.OVERSIGHT_LINT_VERSION }}
        run: |
          set -euo pipefail
          set +e
          npx --yes "oversight-lint@$VERSION" test/error-manifest.json --format github >out.txt 2>&1
          set -e
          grep -F 'title=oversight/required-prop-undocumented' out.txt
          echo "OK: found oversight/required-prop-undocumented"

  no-extractor-expectation:
    name: Drift ignored without expectation
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          manifest: test/drift-manifest.json
          max-warnings: 0
          version: ${{ env.OVERSIGHT_LINT_VERSION }}

  extractor-drift-when-configured:
    name: Configured extractor drift fails
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: lint
        continue-on-error: true
        uses: ./
        with:
          manifest: test/drift-manifest.json
          expected-extractor: react-docgen-typescript
          max-warnings: 0
          version: ${{ env.OVERSIGHT_LINT_VERSION }}
      - name: Assert the action failed on extractor drift
        run: |
          if [[ "${{ steps.lint.outcome }}" != "failure" ]]; then
            echo "Expected extractor drift to exceed max-warnings, got '${{ steps.lint.outcome }}'."
            exit 1
          fi
          echo "OK: configured extractor expectation detected drift."
      - name: Assert extractor-drift annotation title
        env:
          VERSION: ${{ env.OVERSIGHT_LINT_VERSION }}
        run: |
          set -euo pipefail
          set +e
          npx --yes "oversight-lint@$VERSION" test/drift-manifest.json --format github \
            --expected-extractor react-docgen-typescript --max-warnings 0 >out.txt 2>&1
          set -e
          grep -F 'title=oversight/extractor-drift' out.txt
          echo "OK: found oversight/extractor-drift"

  missing-manifest:
    name: Missing manifest fails
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: lint
        continue-on-error: true
        uses: ./
        with:
          manifest: test/does-not-exist.json
          version: ${{ env.OVERSIGHT_LINT_VERSION }}
      - name: Assert the action failed on a missing manifest
        run: |
          if [[ "${{ steps.lint.outcome }}" != "failure" ]]; then
            echo "Expected the action to fail on a missing manifest, got '${{ steps.lint.outcome }}'."
            exit 1
          fi
          echo "OK: the action failed as expected on a missing manifest."

  # The CLI has read the ref-based v:1 manifest since 0.5.0 and every other
  # fixture here is v:0, so a green run said nothing about ref resolution.
  #
  # Asserting "produces findings" would not be enough: a ref that fails to
  # resolve reports docgen-missing per component, which is indistinguishable
  # from real findings. The invariant is that both formats anchor to the same
  # files, which is what packages/cli/src/run.test.ts asserts upstream.
  v1-equivalence:
    name: v1 refs resolve to the same findings as v0
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: lint
        continue-on-error: true
        uses: ./
        with:
          manifest: test/v1/manifests/components.json
          version: ${{ env.OVERSIGHT_LINT_VERSION }}

      - name: Assert the action failed on the v1 manifest
        run: |
          if [[ "${{ steps.lint.outcome }}" != "failure" ]]; then
            echo "Expected the action to fail on v1 findings, got '${{ steps.lint.outcome }}'."
            exit 1
          fi
          echo "OK: the action failed as expected on the v1 manifest."

      - name: Assert v1 and v0 anchor to the same files
        env:
          VERSION: ${{ env.OVERSIGHT_LINT_VERSION }}
        run: |
          set -euo pipefail
          annotations() {
            set +e
            npx --yes "oversight-lint@$VERSION" "$1" --format github 2>/dev/null
            set -e
          }
          annotations test/v1/manifests/components.json > v1.out
          annotations test/v0/components.json > v0.out

          grep -o 'file=[^:,]*' v1.out | sort -u > v1.files
          grep -o 'file=[^:,]*' v0.out | sort -u > v0.files

          if [[ ! -s v1.files ]]; then
            echo "No annotations from the v1 manifest at all."
            cat v1.out
            exit 1
          fi
          if ! diff -u v0.files v1.files; then
            echo "v1 and v0 anchor to different files, so a ref resolved wrongly."
            exit 1
          fi
          echo "OK: both formats anchor to $(wc -l < v1.files) of the same files."

          # A dangling ref surfaces here, and the flat-layout mistake (an index
          # not inside a directory named `manifests`) surfaces as six of them.
          if grep -F 'title=oversight/docgen-missing' v1.out; then
            echo "docgen-missing on the v1 manifest means refs did not resolve."
            exit 1
          fi

          # This rule can only fire from props read out of a resolved payload.
          grep -F 'title=oversight/required-prop-undocumented' v1.out
          echo "OK: props were read through the refs."
