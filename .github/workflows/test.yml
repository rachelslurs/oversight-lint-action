name: Test

on:
  # main only. A branch push and its pull request both fired, so every internal
  # branch ran the whole gate twice. Release keys off Test completing on main,
  # so this trigger has to stay for that.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'oversight-lint version to gate. Defaults to the pinned one.'
        required: false
        type: string
  repository_dispatch:
    types: [oversight-lint-published]
  schedule:
    # Backup if a publish dispatch is missed; primary signal is repository_dispatch.
    - cron: '0 14 * * 1'

permissions:
  contents: read

jobs:
  resolve-version:
    name: Resolve and wait for the version under test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # A publish dispatch names the exact release. A manual run may name one.
      # Otherwise gate the version the action actually ships, which is the whole
      # point of pinning: a push or pull request has to test the pin in the diff,
      # not whatever published most recently.
      - name: Resolve the version under test
        id: resolve
        env:
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${DISPATCH_VERSION:-}"
          if [[ -z "$version" ]]; then
            version="${MANUAL_VERSION:-}"
          fi
          if [[ -z "$version" ]]; then
            version=$(awk '/# oversight-lint-pin:/{found=1} found && /default:/{gsub(/.*default: .|.$/,""); print; exit}' action.yml)
            echo "Using the pinned default from action.yml."
          fi
          if [[ -z "$version" ]]; then
            echo "Could not resolve a version. The pin anchor in action.yml may have moved."
            exit 1
          fi
          echo "Version under test: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Ensure it is on npm
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          echo "Resolving oversight-lint@$VERSION"
          for i in $(seq 1 30); do
            if npm view "oversight-lint@$VERSION" version; then
              exit 0
            fi
            echo "Not visible yet (attempt $i/30); sleeping 10s"
            sleep 10
          done
          echo "Timed out waiting for oversight-lint@$VERSION on npm"
          exit 1

  clean:
    name: Clean manifest passes
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          manifest: test/clean-manifest.json
          max-warnings: 0
          version: ${{ needs.resolve-version.outputs.version }}

  findings:
    name: Error manifest fails
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: lint
        continue-on-error: true
        uses: ./
        with:
          manifest: test/error-manifest.json
          version: ${{ needs.resolve-version.outputs.version }}
      - name: Assert the action failed on error findings
        run: |
          if [[ "${{ steps.lint.outcome }}" != "failure" ]]; then
            echo "Expected the action to fail on error findings, got '${{ steps.lint.outcome }}'."
            exit 1
          fi
          echo "OK: the action failed as expected on error findings."
      - name: Assert required-prop-undocumented annotation title
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          set +e
          npx --yes "oversight-lint@$VERSION" test/error-manifest.json --format github >out.txt 2>&1
          set -e
          grep -F 'title=oversight/required-prop-undocumented' out.txt
          echo "OK: found oversight/required-prop-undocumented"

  no-extractor-expectation:
    name: Drift ignored without expectation
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          manifest: test/drift-manifest.json
          max-warnings: 0
          version: ${{ needs.resolve-version.outputs.version }}

  extractor-drift-when-configured:
    name: Configured extractor drift fails
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: lint
        continue-on-error: true
        uses: ./
        with:
          manifest: test/drift-manifest.json
          expected-extractor: react-docgen-typescript
          max-warnings: 0
          version: ${{ needs.resolve-version.outputs.version }}
      - name: Assert the action failed on extractor drift
        run: |
          if [[ "${{ steps.lint.outcome }}" != "failure" ]]; then
            echo "Expected extractor drift to exceed max-warnings, got '${{ steps.lint.outcome }}'."
            exit 1
          fi
          echo "OK: configured extractor expectation detected drift."
      - name: Assert extractor-drift annotation title
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          set +e
          npx --yes "oversight-lint@$VERSION" test/drift-manifest.json --format github \
            --expected-extractor react-docgen-typescript --max-warnings 0 >out.txt 2>&1
          set -e
          grep -F 'title=oversight/extractor-drift' out.txt
          echo "OK: found oversight/extractor-drift"

  missing-manifest:
    name: Missing manifest fails
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: lint
        continue-on-error: true
        uses: ./
        with:
          manifest: test/does-not-exist.json
          version: ${{ needs.resolve-version.outputs.version }}
      - name: Assert the action failed on a missing manifest
        run: |
          if [[ "${{ steps.lint.outcome }}" != "failure" ]]; then
            echo "Expected the action to fail on a missing manifest, got '${{ steps.lint.outcome }}'."
            exit 1
          fi
          echo "OK: the action failed as expected on a missing manifest."

  # The CLI has read the ref-based v:1 manifest since 0.5.0 and every other
  # fixture here is v:0, so a green run said nothing about ref resolution.
  #
  # Asserting "produces findings" would not be enough: a ref that fails to
  # resolve reports docgen-missing per component, which is indistinguishable
  # from real findings. The invariant is that both formats anchor to the same
  # files, which is what packages/cli/src/run.test.ts asserts upstream.
  v1-equivalence:
    name: v1 refs resolve to the same findings as v0
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: lint
        continue-on-error: true
        uses: ./
        with:
          manifest: test/v1/manifests/components.json
          version: ${{ needs.resolve-version.outputs.version }}

      - name: Assert the action failed on the v1 manifest
        run: |
          if [[ "${{ steps.lint.outcome }}" != "failure" ]]; then
            echo "Expected the action to fail on v1 findings, got '${{ steps.lint.outcome }}'."
            exit 1
          fi
          echo "OK: the action failed as expected on the v1 manifest."

      - name: Assert v1 and v0 anchor to the same files
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          annotations() {
            set +e
            npx --yes "oversight-lint@$VERSION" "$1" --format github 2>/dev/null
            set -e
          }
          annotations test/v1/manifests/components.json > v1.out
          annotations test/v0/components.json > v0.out

          grep -o 'file=[^:,]*' v1.out | sort -u > v1.files
          grep -o 'file=[^:,]*' v0.out | sort -u > v0.files

          if [[ ! -s v1.files ]]; then
            echo "No annotations from the v1 manifest at all."
            cat v1.out
            exit 1
          fi
          if ! diff -u v0.files v1.files; then
            echo "v1 and v0 anchor to different files, so a ref resolved wrongly."
            exit 1
          fi
          echo "OK: both formats anchor to $(wc -l < v1.files) of the same files."

          # A dangling ref surfaces here, and the flat-layout mistake (an index
          # not inside a directory named `manifests`) surfaces as six of them.
          if grep -F 'title=oversight/docgen-missing' v1.out; then
            echo "docgen-missing on the v1 manifest means refs did not resolve."
            exit 1
          fi

          # This rule can only fire from props read out of a resolved payload.
          grep -F 'title=oversight/required-prop-undocumented' v1.out
          echo "OK: props were read through the refs."

  # A publish dispatch is the only thing that proposes a bump. Push, pull request
  # and cron runs gate a version but authorize nothing.
  propose-bump:
    name: Propose a pin bump
    if: github.event_name == 'repository_dispatch'
    needs:
      - resolve-version
      - clean
      - findings
      - no-extractor-expectation
      - extractor-drift-when-configured
      - missing-manifest
      - v1-equivalence
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Queue rather than clobber a half-pushed branch.
    concurrency:
      group: propose-bump
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.BUMP_APP_CLIENT_ID }}
          private-key: ${{ secrets.BUMP_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Rewrite the pin, then open or update the pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Attacker-controllable by anyone who can dispatch, and it reaches a
          # branch name and a file edit, so the regex below is a boundary.
          NEW_VERSION: ${{ github.event.client_payload.version }}
        run: |
          set -euo pipefail
          BRANCH=chore/pin-oversight-lint

          pin_at() {
            git show "$1:action.yml" 2>/dev/null \
              | awk '/# oversight-lint-pin:/{f=1} f && /default:/{gsub(/.*default: .|.$/,""); print; exit}'
          }

          # Refuse and skip rather than fail. The monorepo dispatches on every
          # publish with no stability check, so all three 0.6.0-beta.* releases
          # fired this. A red job for an expected prerelease teaches you to
          # ignore red.
          if [[ ! "$NEW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "$NEW_VERSION is not an exact stable version. Nothing to propose."
            exit 0
          fi

          current=$(pin_at HEAD)
          if [[ -z "$current" ]]; then
            echo "No pin anchor in action.yml. It may have been reformatted."
            exit 1
          fi

          if [[ "$NEW_VERSION" == "$current" ]]; then
            echo "Already pinned to $NEW_VERSION."
            exit 0
          fi

          # sort -V is only safe here because the regex above already rejected
          # prereleases; it orders 1.0.0-beta after 1.0.0. Do not loosen one
          # without the other.
          older=$(printf '%s\n%s\n' "$NEW_VERSION" "$current" | sort -V | head -1)
          if [[ "$older" == "$NEW_VERSION" ]]; then
            echo "$NEW_VERSION is older than the pinned $current. Ignoring."
            exit 0
          fi

          # A slower run for an older release must not force-push backwards over
          # a newer one already proposed on the branch.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch -q origin "$BRANCH"
            proposed=$(pin_at "origin/$BRANCH" || true)
            if [[ -n "$proposed" ]]; then
              older=$(printf '%s\n%s\n' "$NEW_VERSION" "$proposed" | sort -V | head -1)
              if [[ "$NEW_VERSION" != "$proposed" && "$older" == "$NEW_VERSION" ]]; then
                echo "$BRANCH already proposes $proposed, which is newer. Ignoring."
                exit 0
              fi
            fi
          fi

          echo "Proposing $current -> $NEW_VERSION"
          awk -v v="$NEW_VERSION" '
            /# oversight-lint-pin:/{f=1}
            f && /default:/ && !done {sub(/default: .*/, "default: '\''" v "'\''"); done=1}
            {print}
          ' action.yml > action.yml.new && mv action.yml.new action.yml

          if git diff --quiet action.yml; then
            echo "Rewrite produced no change. The pin anchor has moved."
            exit 1
          fi

          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit -qam "ci: pin oversight-lint $NEW_VERSION"
          git push -q --force origin "$BRANCH"

          # A CLI minor is where a new rule can newly fire, so it gets a human.
          # A patch merges itself on green, because 15 releases in 18 days makes
          # a review queue into a permanently stale pin.
          kind=patch
          if [[ "${NEW_VERSION%.*}" != "${current%.*}" ]]; then kind=minor; fi

          # `gh pr view <branch>` matches a pull request in any state, so once
          # this branch has been merged once it always looks like one is open
          # and no new one is ever created. Ask for open ones on this head only.
          open_pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [[ -z "$open_pr" ]]; then
            gh pr create --base main --head "$BRANCH" \
              --title "ci: pin oversight-lint $NEW_VERSION" \
              --body "Gated by this run against \`$NEW_VERSION\`. Previous pin was \`$current\`, so this is a $kind bump."
          else
            echo "Updated the open pull request."
          fi

          if [[ "$kind" == patch ]]; then
            gh pr merge "$BRANCH" --auto --squash \
              || echo "Could not enable auto-merge. Merge by hand; check Allow auto-merge and the required checks."
          else
            echo "Minor bump, leaving it for review."
          fi
