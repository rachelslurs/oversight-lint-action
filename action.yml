name: 'Oversight Lint'
description: "Lint your Storybook MCP components manifest in CI, reporting missing or broken component docs as GitHub annotations."
author: 'Rachel Cantor'

branding:
  icon: 'eye'
  color: 'red'

inputs:
  manifest:
    description: 'Path to the built components.json (from `storybook build` with @storybook/addon-mcp).'
    required: false
    default: 'storybook-static/manifests/components.json'
  max-warnings:
    description: 'Fail if the number of warnings exceeds this. Omit for no limit.'
    required: false
    default: ''
  config:
    description: 'Path to an oversight.config.json (rules, expectedExtractor, ...).'
    required: false
    default: ''
  expected-extractor:
    description: 'Extractor the manifest should have used. Enables extractor-drift; omit to leave that rule off (same as the Storybook addon).'
    required: false
    default: ''
  version:
    description: 'oversight-lint version to run — an npm dist-tag or exact version. Defaults to the version this action has tested.'
    required: false
    # oversight-lint-pin: the tested version. The line below is rewritten by the
    # propose-bump job in test.yml and read back by resolve-version, so both the
    # writer and the reader depend on this anchor. Do not reformat.
    default: '0.6.1'
  working-directory:
    description: 'Directory to run in.'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: Lint the components manifest
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # Inputs are passed through env and read as shell variables, never
      # interpolated into the script body, so a crafted input can't inject shell.
      env:
        INPUT_MANIFEST: ${{ inputs.manifest }}
        INPUT_MAX_WARNINGS: ${{ inputs.max-warnings }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_EXPECTED_EXTRACTOR: ${{ inputs.expected-extractor }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        args=("$INPUT_MANIFEST" --format github)
        if [[ -n "$INPUT_MAX_WARNINGS" ]]; then args+=(--max-warnings "$INPUT_MAX_WARNINGS"); fi
        if [[ -n "$INPUT_CONFIG" ]]; then args+=(--config "$INPUT_CONFIG"); fi
        if [[ -n "$INPUT_EXPECTED_EXTRACTOR" ]]; then args+=(--expected-extractor "$INPUT_EXPECTED_EXTRACTOR"); fi

        # An npm dist-tag can point at an older release than `latest` and
        # nothing says so: `beta` sat on a prerelease for weeks after the stable
        # shipped. An exact version stays quiet, because pinning is deliberate.
        #
        # Every lookup tolerates failure. This runs under `set -euo pipefail` in
        # front of the only thing the action exists to do, so a registry hiccup
        # must not take the run down over an advisory.
        if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          resolved=$(npm view "oversight-lint@$INPUT_VERSION" version 2>/dev/null | tail -1 || true)
          newest=$(npm view "oversight-lint" version 2>/dev/null | tail -1 || true)
          if [[ -n "$resolved" && -n "$newest" && "$resolved" != "$newest" ]]; then
            older=$(printf '%s\n%s\n' "$resolved" "$newest" | sort -V | head -1)
            if [[ "$older" == "$resolved" ]]; then
              echo "::warning title=oversight/stale-dist-tag::The ${INPUT_VERSION} tag resolves to oversight-lint ${resolved}, which is older than latest (${newest}). Pin an exact version, or move the tag."
            fi
          fi
        fi

        npx --yes "oversight-lint@$INPUT_VERSION" "${args[@]}"
